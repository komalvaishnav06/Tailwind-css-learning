<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head >
<body>
    <header class="flex items-center justify-between 
                   bg-[#161b22] border-b border-gray-700
                   px-5 py-3 fixed top-0 left-0 w-full z-50 -translate-y-[calc(100%-10px)] hover:translate-y-0 transition-transform duration-300">
        <!-- logo -->
        <div class="flex items-center gap-3">
            <i data-lucide="graduation-cap" class="w-7 h-7 text-pink-700"></i>
            <h1 class="text-xl font-bold text-white">
                LearnHub
            </h1>
        </div>
        <!-- Search bar -->
        <div class="ml-auto flex items-center gap-5">
        <div class="relative w-60">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
            <input type="search" placeholder="search course..."
            class=" bg-[ #0d1117] border border-gray-700 rounded-lg px-5 py-1 w-full pl-9 pr-0  text-white outline-none focus:border-pink-500">
        </div>
        <!-- notification -->
        <button class="relative p-2 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute -top-0 -right-0 bg-pink-500 text-white text-xs rounded-full w-3 h-3 flex items-center justify-center">
                <!-- {{ unread_count }} -->
            </span>
        </button>
        <!-- profile -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-pink-500 flex items-center justify-center text-white font-semibold leading-none">
                k
            </div>
            <div>
                <p class="text-white font-medium text-sm">komal</p>
                <p class="text-gray-400 text-xs">Student</p>
            </div>
        </div>
       </div> 
    </header>

    <aside id="sidebar" class="fixed left-0 top-0 h-screen w-16 bg-gray-900 text-white transition-all duration-300">
        <button id="logobtn" class="flex items-center gap-4 p-5">
            <i data-lucide="heart" class="shrink-0 text-pink-500"></i>
            <span class="group-hover:block whitespace-nowrap absolute left-full ml-3
                 top-1/2-translate-y-1/2 hidden text-white">My Website</span>
            <!-- My logo -->
        </button>
        <hr class="mx-2 bg-gray-500">
        <nav class="flex flex-col mt-4 gap-2">
            <a href="#home"
                class="group relative flex items-center gap-4 p-5 text-white bg-gray-500 hover:bg-gray-700 rounded-md">
                <i data-lucide="home" class="shrink-0"></i>
                <span class="absolute left-full ml-3
                 top-1/2-translate-y-1/2 hidden
                 group-hover:block whitespace-nowrap
                 rounded-md bg-gray-700 px-3 py-2 text-sm shadow-lg                
                ">
                    Home
                </span>

                <!-- Expanded sidebar mein naam -->
                <span class="sidebar-label hidden whitespace-nowrap">
                    Home
                </span>
            </a>
        </nav>
        <nav class="flex flex-col mt-4 gap-2">
            <a href="#income"
                class="group relative flex items-center gap-4 p-5 text-white bg-gray-500 hover:bg-gray-700 rounded-md">
                <i data-lucide="indian-rupee" class="shrink-0"></i>
                <span class="absolute left-full ml-3
                top-1/2-translate-y-1/2 hidden
                group-hover:block whitespace-nowrap
                rounded-md bg-gray-700 px-3 py-2 text-sm shadow-lg
                ">
                    income
                </span>
                <span class="sidebar-label hidden whitespace-nowrap">
                    income
                </span>
            </a>
        </nav>
        <nav class="flex flex-col mt-4 gap-2">
            <a href="#Contact"
                class="group relative flex items-center gap-4 p-5 text-white bg-gray-500 hover:bg-gray-700 rounded-md">
                <i data-lucide="Contact" class="shrink-0"></i>
                <span class="absolute left-full ml-3
                top-1/2-translate-y-1/2 hidden
                group-hover:block whitespace-nowrap
                rounded-md bg-gray-700 px-3 py-2 text-sm shadow-lg">
                    Contact
                </span>
            </a>
        </nav>
        <nav class="flex flex-col mt-4 gap-2">
            <a href="#About"
                class="group relative flex items-center gap-4 p-5 text-white bg-gray-500 hover:bg-gray-700 rounded-md">
                <i data-lucide="info" class="shrink-0"></i>
                <span class="absolute left-full ml-3
                top-1/2-translate-y-1/2 hidden
                group-hover:block whitespace-nowrap
                rounded-md bg-gray-700 px-3 py-2 text-sm shadow-lg">
                    About
                </span>
            </a>
        </nav>
    </aside>
    
    <script>
        lucide.createIcons();
        const sidebar = document.getElementById("sidebar");
        const logobtn = document.getElementById("logobtn");
        const labels = document.querySelectorAll(".sidebar-label");
        // const tooltip = document.querySelectorAll(".sidebar-tooltip");

        let isOpen = false;

        logobtn.addEventListener("click", () => {
            isOpen = !isOpen;

            sidebar.classList.toggle("w-16", !isOpen);
            sidebar.classList.toggle("w-56", isOpen);

            labels.forEach(label => {
                label.classList.toggle("hidden", !isOpen);

            // tooltip.forEach(tooltip => {
            //     tooltip.classList.toggle("group-hover:block",!isOpen);
            // });
            });
        });
    </script>
    <!-- <script>
        lucide.createIcons();
    </script> -->
</body>
</html>
