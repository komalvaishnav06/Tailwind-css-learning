<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="h-screen">
    <div class="bg-gray-200 size-full flex">
        <div class="bg-red-300 size-20 "></div>
        <div class="bg-pink-300 size-20 "></div>
        <div class="bg-green-300 size-20 "></div>
        <div class="bg-blue-300 size-20 "></div>
    </div>
    <div class="bg-gray-200 size-full flex flex-col-reverse">
        <div class="bg-red-300 size-20 "></div>
        <div class="bg-pink-300 size-20 "></div>
        <div class="bg-green-300 size-20 "></div>
        <div class="bg-blue-300 size-20 "></div>
    </div>
    <div class="bg-gray-200 size-full flex justify-center">
        <div class="bg-red-300 size-20 "></div>
        <div class="bg-pink-300 size-20 "></div>
        <div class="bg-green-300 size-20 "></div>
        <div class="bg-blue-300 size-20 "></div>
    </div>
    <div class="bg-gray-200 size-full flex items-center justify-center">
        <div class="bg-red-300 size-20 "></div>
        <div class="bg-pink-300 size-20 "></div>
        <div class="bg-green-300 size-20 "></div>
        <div class="bg-blue-300 size-20 "></div>
    </div>
    <div class="bg-gray-200 size-full flex items-center justify-around">
        <div class="bg-red-300 size-20 "></div>
        <div class="bg-pink-300 size-20 "></div>
        <div class="bg-green-300 size-20 "></div>
        <div class="bg-blue-300 size-20 "></div>
    </div>
    
</body>
</html>
