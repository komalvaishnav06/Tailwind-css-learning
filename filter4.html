<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <div>
        <h1>grayscale</h1>
        <img src="squirel.jpg" class=" size-100 grayscale">
    </div>
    <div>
        <h1>invert</h1>
        <img src="squirel.jpg" class=" size-100 invert">
    </div>
    <div>
        <h1>hue</h1>
        <img src="squirel.jpg" class=" size-100 hue-rotate-0">
        <img src="squirel.jpg" class=" size-100 hue-rotate-50">
        <img src="squirel.jpg" class=" size-100 hue-rotate-100">
        <img src="squirel.jpg" class=" size-100 hue-rotate-150">
        <img src="squirel.jpg" class=" size-100 hue-rotate-200">
        <img src="squirel.jpg" class=" size-100 hue-rotate-250">
        <img src="squirel.jpg" class=" size-100 hue-rotate-390">
    </div>
</body>
</html>
